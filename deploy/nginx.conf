# /etc/nginx/sites-available/cti
# certbot --nginx -d your.domain.example will add the TLS block and the 80 -> 443 redirect.
limit_req_zone $binary_remote_addr zone=cti_chat:10m rate=10r/m;
limit_req_zone $server_name zone=cti_chat_global:10m rate=5r/m;
limit_conn_zone $server_name zone=cti_chat_conn:10m;

server {
    listen 80;
    server_name _;

    root /srv/cti/app/web;
    index index.html;

    # pipeline output, read-only, no caching so the dashboard always sees the latest run
    location /data/ {
        alias /srv/cti/data/;
        autoindex off;
        add_header Cache-Control "no-store";
        types { application/json json; text/markdown md; }
    }

    location = /api/chat {
        if ($scheme != https) { return 426; }
        client_max_body_size 8k;
        limit_req zone=cti_chat burst=4 nodelay;
        limit_req zone=cti_chat_global burst=2 nodelay;
        limit_conn cti_chat_conn 1;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_read_timeout 70s;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    server_tokens off;

    access_log /var/log/nginx/cti.access.log;
    error_log  /var/log/nginx/cti.error.log;
}
